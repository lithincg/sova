services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sova
      POSTGRES_USER: sova
      POSTGRES_PASSWORD: sova
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sova -d sova"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  sova-worker-1:
    build: .
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sova
      - SPRING_DATASOURCE_USERNAME=sova
      - SPRING_DATASOURCE_PASSWORD=sova
      - REDIS_URL=redis://redis:6379
      - SOVA_WORKER_ID=worker-1
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sova-worker-2:
    build: .
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sova
      - SPRING_DATASOURCE_USERNAME=sova
      - SPRING_DATASOURCE_PASSWORD=sova
      - REDIS_URL=redis://redis:6379
      - SOVA_WORKER_ID=worker-2
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
