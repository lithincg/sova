<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sova — Distributed Job Scheduler</title>
<style>
  :root {
    --bg: #0b1020; --card: #121a30; --border: #233054;
    --text: #e6ecff; --muted: #93a3c7; --accent: #38bdf8;
    --green: #22c55e; --amber: #f59e0b; --red: #ef4444; --purple: #a855f7;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  body { margin: 0; background: var(--bg); color: var(--text); padding: 24px; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: 0.4px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .pill { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: #142a22; color: var(--green); border: 1px solid #1e4d38; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; }
  .stat .val { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .card h2 { margin: 0 0 12px 0; font-size: 15px; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select { background: #0b1224; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  button { background: var(--accent); color: #06131f; font-weight: 600; border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; font-size: 13px; }
  button:hover { opacity: 0.92; }
  button.replay { background: #2d1b4e; color: #d8b4fe; border: 1px solid #581c87; padding: 4px 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .badge { padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .PENDING { background: #2c2411; color: var(--amber); }
  .CLAIMED, .RUNNING { background: #10253a; color: var(--accent); }
  .SUCCEEDED { background: #132a1d; color: var(--green); }
  .DEAD, .FAILED { background: #331419; color: var(--red); }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; color: var(--muted); }
  #msg { margin-top: 8px; font-size: 12px; color: var(--green); min-height: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Sova — Distributed Job Scheduler</h1>
      <div class="sub">PostgreSQL FOR UPDATE SKIP LOCKED &middot; Redis TTL Heartbeats &middot; Backoff + DLQ</div>
    </div>
    <div class="pill" id="health">Checking...</div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="card">
    <h2>Submit Job</h2>
    <form id="submitForm">
      <label>Type
        <select id="type">
          <option value="echo">echo (instant)</option>
          <option value="sleep">sleep (ms payload)</option>
          <option value="flaky">flaky (fail N times)</option>
        </select>
      </label>
      <label>Payload <input id="payload" value="hello sova" /></label>
      <label>Priority <input id="priority" type="number" value="1" /></label>
      <label>Max Attempts <input id="maxAttempts" type="number" value="3" min="1" /></label>
      <label>Idempotency-Key (optional) <input id="idemKey" placeholder="e.g. order-101" /></label>
      <button type="submit">Submit Job</button>
    </form>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>Recent Jobs <span class="sub">(auto-refreshes every 2s)</span></h2>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Type</th><th>Status</th><th>Attempts</th><th>Priority</th><th>Worker</th><th>Payload</th><th>Action</th>
        </tr>
      </thead>
      <tbody id="jobsBody"></tbody>
    </table>
  </div>
</div>

<script>
const STATUS_ORDER = ["PENDING", "CLAIMED", "RUNNING", "SUCCEEDED", "DEAD"];

async function refresh() {
  try {
    const [statsRes, jobsRes, healthRes] = await Promise.all([
      fetch("/jobs/stats"),
      fetch("/jobs"),
      fetch("/health")
    ]);
    document.getElementById("health").textContent = healthRes.ok ? "LIVE" : "DEGRADED";
    const stats = await statsRes.json();
    document.getElementById("stats").innerHTML = STATUS_ORDER.map(s => `
      <div class="stat"><div class="label">${s}</div><div class="val">${stats[s] ?? 0}</div></div>
    `).join("");

    const jobs = await jobsRes.json();
    document.getElementById("jobsBody").innerHTML = jobs.slice(0, 30).map(j => `
      <tr>
        <td class="mono">${j.id.slice(0, 8)}</td>
        <td>${j.type}</td>
        <td><span class="badge ${j.status}">${j.status}</span></td>
        <td>${j.attempts}/${j.maxAttempts}</td>
        <td>${j.priority}</td>
        <td class="mono">${j.claimedBy ?? "-"}</td>
        <td class="mono">${(j.payload ?? "").slice(0, 32)}</td>
        <td>${j.status === "DEAD" ? `<button class="replay" onclick="replay('${j.id}')">Replay</button>` : ""}</td>
      </tr>
    `).join("");
  } catch (e) {
    document.getElementById("health").textContent = "OFFLINE";
  }
}

async function replay(id) {
  await fetch(`/jobs/${id}/replay`, { method: "POST" });
  refresh();
}

document.getElementById("submitForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const headers = { "Content-Type": "application/json" };
  const idem = document.getElementById("idemKey").value.trim();
  if (idem) headers["Idempotency-Key"] = idem;
  const body = {
    type: document.getElementById("type").value,
    payload: document.getElementById("payload").value,
    priority: Number(document.getElementById("priority").value),
    maxAttempts: Number(document.getElementById("maxAttempts").value)
  };
  const res = await fetch("/jobs", { method: "POST", headers, body: JSON.stringify(body) });
  const data = await res.json();
  document.getElementById("msg").textContent = res.ok
    ? `Submitted job ${data.id} (status: ${data.status})`
    : `Error: ${JSON.stringify(data)}`;
  refresh();
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
