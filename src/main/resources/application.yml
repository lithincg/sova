server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: sova
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sova}
    username: ${SPRING_DATASOURCE_USERNAME:sova}
    password: ${SPRING_DATASOURCE_PASSWORD:sova}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

sova:
  worker-id: ${SOVA_WORKER_ID:}
  worker-enabled: ${SOVA_WORKER_ENABLED:true}
  reaper-enabled: ${SOVA_REAPER_ENABLED:true}
  poll-delay-ms: 1000
  batch-size: 5
  heartbeat-ttl-seconds: 30
  heartbeat-refresh-ms: 10000
  reaper-delay-ms: 15000
  claim-grace-seconds: 15
  retry-base-seconds: 5
  retry-max-seconds: 300
